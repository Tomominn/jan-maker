<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JAN画像からバーコード生成</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    input, button { font-size: 1.2em; margin: 10px; }
    svg { margin: 20px; }
    img { max-width: 300px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>画像からJANコードを読み取ってバーコード生成</h1>

  <input type="file" accept="image/*" onchange="handleImage(this)">
  <div id="preview"></div>
  <div id="results"></div>

  <script>
    function handleImage(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          document.getElementById('preview').innerHTML = '';
          document.getElementById('preview').appendChild(img);
          extractTextFromImage(img);
        };
      };
      reader.readAsDataURL(file);
    }

    async function extractTextFromImage(image) {
      document.getElementById('results').innerHTML = '読み取り中...';

      const { data: { text } } = await Tesseract.recognize(image, 'eng', {
        tessedit_char_whitelist: '0123456789'
      });

      const janCodes = text.match(/\d{11,13}/g) || [];
      const resultArea = document.getElementById('results');
      resultArea.innerHTML = '';

      if (janCodes.length === 0) {
        resultArea.innerHTML = 'JANコードが見つかりませんでした。';
        return;
      }

      janCodes.forEach((code, index) => {
        let fullJan = code;
        if (code.length === 11) {
          fullJan += calculateCheckDigit(code);
        }

        if (!/^\d{12,13}$/.test(fullJan)) return;

        const container = document.createElement('div');
        const barcode = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        barcode.id = "barcode" + index;

        const label = document.createElement('p');
        label.innerText = `JAN: ${fullJan}`;

        container.appendChild(label);
        container.appendChild(barcode);
        resultArea.appendChild(container);

        JsBarcode(barcode, fullJan, {
          format: "ean13",
          lineColor: "#000",
          width: 2,
          height: 100,
          displayValue: true
        });
      });
    }

    function calculateCheckDigit(code) {
      let sum = 0;
      for (let i = 0; i < code.length; i++) {
        const n = parseInt(code[i]);
        sum += i % 2 === 0 ? n : n * 3;
      }
      return (10 - (sum % 10)) % 10;
    }
  </script>
</body>
</html>
